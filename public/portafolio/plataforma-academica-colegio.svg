        <rect x="204" y="94" width="26" height="26" rx="7" /><rect x="264" y="94" width="26" height="26" rx="7" /><rect x="384" y="94" width="26" height="26" rx="7" /><rect x="444" y="94" width="26" height="26" rx="7" />
        <rect x="204" y="152" width="26" height="26" rx="7" /><rect x="264" y="152" width="26" height="26" rx="7" /><rect x="324" y="152" width="26" height="26" rx="7" /><rect x="384" y="152" width="26" height="26" rx="7" />
        <rect x="204" y="210" width="26" height="26" rx="7" /><rect x="324" y="210" width="26" height="26" rx="7" /><rect x="384" y="210" width="26" height="26" rx="7" /><rect x="444" y="210" width="26" height="26" rx="7" />
        <rect x="204" y="268" width="26" height="26" rx="7" /><rect x="264" y="268" width="26" height="26" rx="7" /><rect x="324" y="268" width="26" height="26" rx="7" /><rect x="384" y="268" width="26" height="26" rx="7" /><rect x="444" y="268" width="26" height="26" rx="7" />
