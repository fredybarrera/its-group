<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="630" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A" />
      <stop offset="0.6" stop-color="#1e293b" />
      <stop offset="1" stop-color="#92400e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="200" cy="90" r="2" /><circle cx="420" cy="60" r="2" /><circle cx="980" cy="520" r="2" /><circle cx="1100" cy="300" r="2" /><circle cx="90" cy="380" r="2" />
  </g>

  <!-- Ruta de migración por etapas -->
  <path d="M180 500 C340 500 360 400 480 390 S640 300 720 280 S860 200 900 180" stroke="#ffffff" stroke-opacity="0.15" stroke-width="10" stroke-linecap="round" />
  <path d="M180 500 C340 500 360 400 480 390 S640 300 720 280" stroke="#34d399" stroke-width="10" stroke-linecap="round" />
  <path d="M720 280 S860 200 900 180" stroke="#fbbf24" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round" />

  <!-- Hitos completados -->
  <g>
    <circle cx="180" cy="500" r="26" fill="#10b981" />
    <path d="M169 500 L177 508 L192 492" stroke="#0D1B2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="480" cy="390" r="26" fill="#10b981" />
    <path d="M469 390 L477 398 L492 382" stroke="#0D1B2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="720" cy="280" r="26" fill="#0D1B2A" stroke="#34d399" stroke-width="4" />
    <circle cx="720" cy="280" r="9" fill="#34d399" />
  </g>

  <!-- Etiquetas de etapa -->
  <g fill="#ffffff">
    <rect x="130" y="545" width="100" height="10" rx="5" fill-opacity="0.35" />
    <rect x="430" y="435" width="100" height="10" rx="5" fill-opacity="0.35" />
    <rect x="670" y="325" width="100" height="10" rx="5" fill-opacity="0.35" />
  </g>

  <!-- Servidor de origen -->
  <g transform="translate(110 330)">
    <rect width="140" height="40" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" />
    <rect y="50" width="140" height="40" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" />
    <circle cx="116" cy="20" r="5" fill="#fbbf24" /><circle cx="116" cy="70" r="5" fill="#fbbf24" />
    <rect x="18" y="16" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.25" />
    <rect x="18" y="66" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.25" />
  </g>

  <!-- Nube de destino -->
  <g transform="translate(880 90)">
    <path d="M40 150 H230 C262 150 280 124 274 98 C268 72 242 60 220 66 C214 26 178 2 138 8 C108 12 88 32 80 54 C62 44 38 46 24 60 C8 76 8 98 16 112 C-6 120 -8 150 40 150 Z" fill="#f59e0b" fill-opacity="0.12" stroke="#fbbf24" stroke-width="3" />
    <path d="M110 104 L134 80 L158 104 M134 82 V128" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Indicador de costos -->
  <g transform="translate(860 360)">
    <rect width="230" height="150" rx="20" fill="#0D1B2A" stroke="#ffffff" stroke-opacity="0.15" />
    <rect x="24" y="24" width="90" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.45" />
    <path d="M40 118 A75 75 0 0 1 190 118" stroke="#ffffff" stroke-opacity="0.12" stroke-width="14" stroke-linecap="round" />
    <path d="M40 118 A75 75 0 0 1 102 45" stroke="#34d399" stroke-width="14" stroke-linecap="round" />
    <path d="M115 118 L88 66" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <circle cx="115" cy="118" r="9" fill="#fbbf24" />
  </g>

  <!-- Escudo de seguridad -->
  <g transform="translate(560 120)">
    <path d="M50 0 L100 18 V54 C100 86 78 108 50 120 C22 108 0 86 0 54 V18 Z" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-width="3" />
    <rect x="32" y="52" width="36" height="30" rx="5" fill="#34d399" />
    <path d="M38 52 V44 A12 12 0 0 1 62 44 V52" stroke="#34d399" stroke-width="4" />
  </g>
</svg>
