<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Capas GIS apiladas (vista isométrica) -->
  <!-- Capa inferior: relieve / curvas de nivel -->
  <g transform="translate(600 460)">
    <path d="M-300 0 L0 -110 L300 0 L0 110 Z" fill="#064e3b" stroke="#34d399" stroke-opacity="0.5" stroke-width="2" />
    <g stroke="#34d399" stroke-opacity="0.45" stroke-width="1.5" fill="none">
      <ellipse cx="-30" cy="0" rx="150" ry="50" /><ellipse cx="-30" cy="0" rx="100" ry="32" /><ellipse cx="-30" cy="0" rx="50" ry="16" />
    </g>
  </g>

  <!-- Capa media: calles y predios -->
  <g transform="translate(600 320)">
    <path d="M-300 0 L0 -110 L300 0 L0 110 Z" fill="#0D1B2A" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="3">
      <path d="M-150 -55 L150 55" /><path d="M-150 55 L150 -55" /><path d="M-230 -25 L70 85" />
    </g>
    <g fill="#34d399" fill-opacity="0.3">
      <path d="M-40 -60 L10 -78 L50 -64 L0 -46 Z" /><path d="M60 -20 L110 -38 L150 -24 L100 -6 Z" />
      <path d="M-120 10 L-70 -8 L-30 6 L-80 24 Z" /><path d="M20 40 L70 22 L110 36 L60 54 Z" />
    </g>
  </g>

  <!-- Capa superior: puntos de interés -->
  <g transform="translate(600 180)">
    <path d="M-300 0 L0 -110 L300 0 L0 110 Z" fill="#ffffff" fill-opacity="0.04" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="8 7" />
    <g fill="#34d399">
      <circle cx="-120" cy="10" r="9" /><circle cx="90" cy="-30" r="9" /><circle cx="140" cy="20" r="9" /><circle cx="-40" cy="50" r="9" />
    </g>
    <!-- Punto destacado -->
    <path d="M10 -2 C2 -22 -20 -36 -20 -58 A30 30 0 0 1 40 -58 C40 -36 18 -22 10 -2 Z" fill="#f59e0b" />
    <circle cx="10" cy="-58" r="11" fill="#0D1B2A" />
  </g>

  <!-- Línea vertical que atraviesa las capas: análisis espacial -->
  <path d="M610 178 V460" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 6" />
  <g fill="#fbbf24"><circle cx="610" cy="320" r="6" /><circle cx="610" cy="460" r="6" /></g>

  <!-- Leyenda de capas -->
  <g transform="translate(960 150)">
    <rect width="170" height="170" rx="18" fill="#0D1B2A" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.15" />
    <g>
      <rect x="22" y="30" width="18" height="18" rx="5" fill="#f59e0b" /><rect x="52" y="35" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.4" />
      <rect x="22" y="76" width="18" height="18" rx="5" fill="#ffffff" fill-opacity="0.4" /><rect x="52" y="81" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.4" />
      <rect x="22" y="122" width="18" height="18" rx="5" fill="#34d399" /><rect x="52" y="127" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.4" />
    </g>
  </g>

  <!-- Brújula -->
  <g transform="translate(150 140)">
    <circle r="46" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
    <path d="M0 -36 L10 0 L0 36 L-10 0 Z" fill="#ffffff" fill-opacity="0.2" />
    <path d="M0 -36 L10 0 L-10 0 Z" fill="#fbbf24" />
  </g>
</svg>
